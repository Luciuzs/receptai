<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ką valgom?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7EDE9; --surface:#F7FAF8; --ink:#1D3328; --muted:#5B6F64; --line:#C9D5CE;
  --accent:#E3A72F; --accent-ink:#2A1F05;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141C18; --surface:#1D2822; --ink:#E4ECE7; --muted:#9AAEA3; --line:#2F3D35;
    --accent:#E8B04A; --accent-ink:#221803;
  }
}
:root[data-theme="dark"]{
  --bg:#141C18; --surface:#1D2822; --ink:#E4ECE7; --muted:#9AAEA3; --line:#2F3D35;
  --accent:#E8B04A; --accent-ink:#221803;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;
}
main{max-width:560px; margin:0 auto; padding:28px 18px 40px}
h1{
  font-size:clamp(3rem, 16vw, 5.2rem); font-weight:800; line-height:.9;
  letter-spacing:-.04em; margin:8px 0 22px;
}
.times{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:26px}
.times button{
  font:inherit; font-weight:600; font-size:15px; color:var(--ink);
  background:var(--surface); border:1.5px solid var(--line); border-radius:14px;
  padding:14px 4px; cursor:pointer; line-height:1.15;
}
.times button span{display:block; font-size:22px; font-weight:800; letter-spacing:-.02em}
.times button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.list{list-style:none; margin:0; padding:0; border-top:1.5px solid var(--line)}
.list li{border-bottom:1.5px solid var(--line)}
.item{
  all:unset; box-sizing:border-box; width:100%; cursor:pointer;
  display:grid; grid-template-columns:1fr auto; gap:2px 14px; padding:15px 2px;
}
.item b{font-size:19px; font-weight:600; line-height:1.2}
.item small{grid-column:1; color:var(--muted); font-size:14.5px}
.item .min{grid-row:1 / span 2; grid-column:2; align-self:center; font-weight:800; font-size:18px; white-space:nowrap}
.item:focus-visible,.times button:focus-visible,.close:focus-visible{outline:3px solid var(--accent); outline-offset:3px}
dialog{
  border:0; padding:0; margin:auto auto 0; width:100%; max-width:560px; max-height:88vh;
  background:var(--surface); color:var(--ink); border-radius:22px 22px 0 0;
}
dialog::backdrop{background:rgba(10,20,15,.45)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion: reduce){dialog[open]{animation:none}}
.sheet{padding:22px 22px calc(28px + env(safe-area-inset-bottom,0px)); overflow-y:auto; max-height:88vh}
.sheet header{display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.sheet h2{font-size:28px; font-weight:800; letter-spacing:-.02em; line-height:1.05; margin:0}
.sheet .meta{color:var(--muted); margin:6px 0 18px}
.close{all:unset; cursor:pointer; font-size:26px; line-height:1; padding:4px 8px; border-radius:10px}
.sheet h3{font-size:16px; font-weight:800; margin:18px 0 6px}
.sheet ul,.sheet ol{margin:0; padding-left:22px}
.sheet li{margin:5px 0}
</style>
</head>
<body>
<main>
  <h1>Ką valgom?</h1>
  <div class="times" role="group" aria-label="Kiek laiko turi">
    <button data-max="15"><span>15</span>min</button>
    <button data-max="30"><span>30</span>min</button>
    <button data-max="60"><span>60</span>min</button>
    <button data-max="999" aria-pressed="true"><span>Visi</span>receptai</button>
  </div>
  <ul class="list" id="list"></ul>
</main>

<dialog id="d" aria-labelledby="dt">
  <div class="sheet">
    <header><h2 id="dt"></h2><button class="close" aria-label="Uždaryti" onclick="d.close()">✕</button></header>
    <p class="meta" id="dm"></p>
    <h3>Reikės</h3><ul id="di"></ul>
    <h3>Gaminimas</h3><ol id="ds"></ol>
  </div>
</dialog>

<script>
const R = [
  {n:"Kiaušinienė su pomidorais", t:10, i:["3 kiaušiniai","1 pomidoras","Pusė svogūno","Sviesto arba aliejaus","Druska, pipirai"],
   s:["Svogūną supjaustyk ir pakepink keptuvėje 2–3 min.","Sudėk pomidoro skilteles, pakepink minutę.","Įmušk kiaušinius, pasūdyk ir kepk, kol sustings."]},
  {n:"Karšti sumuštiniai su sūriu", t:10, i:["4 riekės duonos","Sūris","Kumpis arba dešra","Pomidoras (nebūtina)","Sviestas"],
   s:["Duoną patepk sviestu, dėk kumpį ir pomidorą.","Užbarstyk tarkuoto sūrio.","Kepk orkaitėje 200 °C 6–8 min arba keptuvėje po dangčiu."]},
  {n:"Omletas su sūriu ir kumpiu", t:10, i:["3 kiaušiniai","3 šaukštai pieno","Sūris","Kumpis","Sviestas, druska"],
   s:["Kiaušinius išplak su pienu ir druska.","Supilk į įkaitintą keptuvę su sviestu.","Kai apačia sustings, užberk sūrio ir kumpio, perlenk ir pakepk dar minutę."]},
  {n:"Varškė su grietine ir krapais", t:5, i:["Varškė","Grietinė","Krapai arba svogūnų laiškai","Druska","Duona"],
   s:["Varškę sutrink šakute su grietine.","Įmaišyk susmulkintus krapus, pasūdyk.","Valgyk su duona."]},
  {n:"Makaronai su sviestu ir sūriu", t:15, i:["200 g makaronų","Sviestas","Tarkuotas sūris","Druska, pipirai"],
   s:["Išvirk makaronus pasūdytame vandenyje.","Nupilk, palik šaukštą virimo vandens.","Įmaišyk sviestą ir sūrį, pagardink pipirais."]},
  {n:"Makaronai su dešrelėmis pomidorų padaže", t:20, i:["200 g makaronų","3–4 dešrelės","1 svogūnas","Pomidorų padažas arba pasta","Sūris"],
   s:["Išvirk makaronus.","Pakepink svogūną ir supjaustytas dešreles.","Supilk padažą, pašildyk, sumaišyk su makaronais ir užbarstyk sūrio."]},
  {n:"Keptieji ryžiai su kiaušiniu", t:20, i:["Virti ryžiai (arba 1 puodelis žalių)","2 kiaušiniai","1 morka","Pusė svogūno","Sojų padažas arba druska"],
   s:["Jei reikia, išvirk ryžius.","Pakepink svogūną ir tarkuotą morką.","Suberk ryžius, pakepink, įmušk kiaušinius ir maišyk, kol sustings. Pagardink."]},
  {n:"Blynai", t:25, i:["2 kiaušiniai","500 ml pieno","200 g miltų","Žiupsnelis druskos, šaukštas cukraus","Aliejus"],
   s:["Išplak kiaušinius su pienu, druska ir cukrumi.","Įsijok miltus ir išmaišyk be gumulų.","Kepk plonus blynus įkaitintoje keptuvėje."]},
  {n:"Varškėčiai", t:25, i:["400 g varškės","1 kiaušinis","3–4 šaukštai miltų","2 šaukštai cukraus","Aliejus, grietinė patiekimui"],
   s:["Sumaišyk varškę, kiaušinį, cukrų ir miltus.","Suformuok paplotėlius, apvoliok miltuose.","Kepk ant vidutinės ugnies po 3–4 min iš abiejų pusių."]},
  {n:"Keptos bulvės su svogūnais", t:30, i:["5–6 bulvės","1 svogūnas","Aliejus arba sviestas","Druska, pipirai"],
   s:["Bulves nulupk ir supjaustyk griežinėliais.","Kepk keptuvėje su aliejumi apie 20 min, retkarčiais pamaišydamas.","Pabaigoje sudėk svogūną, pasūdyk ir pakepk dar 5 min."]},
  {n:"Vištienos filė su ryžiais", t:30, i:["1–2 vištienos filė","1 puodelis ryžių","Aliejus","Druska, pipirai, paprika","Agurkas arba pomidoras"],
   s:["Išvirk ryžius.","Filė perpjauk išilgai, pagardink.","Kepk po 5–6 min iš abiejų pusių. Patiek su ryžiais ir daržovėmis."]},
  {n:"Morkų sriuba", t:30, i:["4 morkos","2 bulvės","1 svogūnas","1 l vandens arba sultinio","Grietinė, druska"],
   s:["Pakepink svogūną puode.","Sudėk supjaustytas morkas ir bulves, užpilk vandeniu ir virk 20 min.","Sutrink trintuvu, pasūdyk, patiek su grietine."]},
  {n:"Bulvių blynai", t:40, i:["6 bulvės","1 svogūnas","1 kiaušinis","2 šaukštai miltų","Aliejus, grietinė"],
   s:["Bulves ir svogūną sutarkuok, nuspausk skystį.","Įmaišyk kiaušinį, miltus, druską.","Kepk įkaitintame aliejuje po 3–4 min iš abiejų pusių."]},
  {n:"Makaronų apkepas", t:45, i:["250 g makaronų","3 kiaušiniai","200 ml pieno","Kumpis arba dešrelės","Sūris"],
   s:["Išvirk makaronus, sudėk į formą su kumpiu.","Išplak kiaušinius su pienu ir druska, užpilk.","Užbarstyk sūrio ir kepk 200 °C apie 25 min."]},
  {n:"Orkaitėje keptos bulvės su vištiena", t:50, i:["6 bulvės","4 vištienos šlaunelės arba filė","Aliejus","Česnakas (nebūtina)","Druska, pipirai, paprika"],
   s:["Bulves supjaustyk skiltelėmis, sumaišyk su aliejumi ir prieskoniais.","Sudėk į skardą kartu su pagardinta vištiena.","Kepk 200 °C 40 min, kol bulvės paruduos."]},
  {n:"Vištienos sriuba su makaronais", t:50, i:["300 g vištienos","2 morkos","1 svogūnas","2 bulvės","Sauja smulkių makaronų"],
   s:["Vištieną užpilk 1,5 l vandens ir virk 25 min.","Sudėk supjaustytas daržoves, virk 15 min.","Suberk makaronus, virk dar 5–7 min, pasūdyk."]}
];

const list = document.getElementById('list');
const btns = document.querySelectorAll('.times button');

function render(max){
  list.innerHTML = R.filter(r => r.t <= max).sort((a,b) => a.t - b.t).map(r =>
    `<li><button class="item" data-i="${R.indexOf(r)}"><b>${r.n}</b><small>${r.i.slice(0,3).join(', ')}</small><span class="min">${r.t} min</span></button></li>`
  ).join('');
}

btns.forEach(b => b.onclick = () => {
  btns.forEach(x => x.setAttribute('aria-pressed', x === b));
  render(+b.dataset.max);
});

list.onclick = e => {
  const el = e.target.closest('.item'); if (!el) return;
  const r = R[el.dataset.i];
  dt.textContent = r.n;
  dm.textContent = `Apie ${r.t} min`;
  di.innerHTML = r.i.map(x => `<li>${x}</li>`).join('');
  ds.innerHTML = r.s.map(x => `<li>${x}</li>`).join('');
  d.showModal();
};
d.addEventListener('click', e => { if (e.target === d) d.close(); });

render(999);
</script>
</body>
</html>
